# Jenkins Configuration as Code for the robot execution path.
# Non-secret global defaults live here so Jenkins UI global variables do not need to be created by hand.
# Real secrets should come from key files rendered into a generated JCasC file before Jenkins starts.
# This JCasC file is aligned to the deployed t813 robot execution path.
# The permanent node below uses the deployed SSH launcher convention.

jenkins:
  systemMessage: "Managed by Jenkins Configuration as Code for jenkins-integration."
  numExecutors: 0
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 2
  slaveAgentPort: 50000
  globalNodeProperties:
    - envVars:
        env:
          - key: ROBOTWS_REPO_URL
            value: "git@wrgitlab.ext.net.nokia.com:RAN/robotws.git"
          - key: TESTLINE_CONFIGURATION_REPO_URL
            value: "git@wrgitlab.ext.net.nokia.com:RAN/configuration-management/testline_configuration.git"
          # Keep pip values as controller environment variables because internal PyPI URLs can contain credentials/tokens.
          - key: PIP_INDEX_URL
            value: "${PIP_INDEX_URL}"
          - key: PIP_EXTRA_INDEX_URL
            value: "${PIP_EXTRA_INDEX_URL}"
          - key: PIP_TRUSTED_HOST
            value: "${PIP_TRUSTED_HOST}"
  nodes:
    - permanent:
        name: "t813-agent"
        nodeDescription: "T813 Linux robot executor for robotws and testline_configuration jobs."
        remoteFS: "/automation/workspace"
        labelString: "t813 robot"
        numExecutors: 1
        mode: EXCLUSIVE
        launcher:
          ssh:
            host: "10.57.159.149"
            port: 22
            credentialsId: "t813-agent-ssh"
            javaPath: "/usr/bin/java"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        nodeProperties:
          - envVars:
              env:
                - key: ROBOT_AGENT_HOME
                  value: "/home/ute"
                - key: PYTHON_BIN
                  value: "/usr/bin/python3"
                - key: ROBOTWS_GIT_SSH_KEY_PATH
                  value: "${ROBOTWS_GIT_SSH_KEY_PATH}"
                - key: TESTLINE_CONFIGURATION_GIT_SSH_KEY_PATH
                  value: "${TESTLINE_CONFIGURATION_GIT_SSH_KEY_PATH}"

unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "${JENKINS_ADMIN_EMAIL}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "t813-agent-ssh"
              username: "${T813_AGENT_SSH_USER}"
              description: "SSH key for t813-agent"
              privateKeySource:
                directEntry:
                  privateKey: __T813_AGENT_SSH_PRIVATE_KEY_BLOCK__

# Intentionally not defined here:
# - ROBOTWS_GIT_REF
# - TESTLINE_CONFIGURATION_GIT_REF
# Those stay job-level configurable. The current recommended job default for both is master.
