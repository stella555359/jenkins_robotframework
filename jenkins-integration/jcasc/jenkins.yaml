unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "${JENKINS_ADMIN_EMAIL}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "t813-agent-ssh"
              username: "${T813_AGENT_SSH_USER}"
              description: "SSH key for t813-agent"
              privateKeySource:
                directEntry:
                  privateKey: __T813_AGENT_SSH_PRIVATE_KEY_BLOCK__

