# Jenkins Configuration as Code for the robot execution path.
# Non-secret global defaults live here so Jenkins UI global variables do not need to be created by hand.
# Real secrets should come from key files rendered into a generated JCasC file before Jenkins starts.
# This JCasC file is aligned to the deployed t813 robot execution path.
# The permanent node below uses the deployed SSH launcher convention.

jenkins:
  systemMessage: "Managed by Jenkins Configuration as Code for jenkins-integration."
  numExecutors: 0
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 2
  slaveAgentPort: 50000
  globalNodeProperties:
    - envVars:
        env:
          - key: ROBOTWS_REPO_URL
            value: "git@wrgitlab.ext.net.nokia.com:RAN/robotws.git"
          - key: TESTLINE_CONFIGURATION_REPO_URL
            value: "git@wrgitlab.ext.net.nokia.com:RAN/configuration-management/testline_configuration.git"
          - key: JENKINS_ROBOTFRAMEWORK_REPO_URL
            value: "${JENKINS_ROBOTFRAMEWORK_REPO_URL}"
          - key: JENKINS_ROBOTFRAMEWORK_GIT_REF
            value: "${JENKINS_ROBOTFRAMEWORK_GIT_REF}"
          - key: JENKINS_ROBOTFRAMEWORK_CREDENTIALS_ID
            value: "${JENKINS_ROBOTFRAMEWORK_CREDENTIALS_ID}"
          # Keep pip values as controller environment variables because internal PyPI URLs can contain credentials/tokens.
          - key: PIP_INDEX_URL
            value: "${PIP_INDEX_URL}"
          - key: PIP_EXTRA_INDEX_URL
            value: "${PIP_EXTRA_INDEX_URL}"
          - key: PIP_TRUSTED_HOST
            value: "${PIP_TRUSTED_HOST}"
